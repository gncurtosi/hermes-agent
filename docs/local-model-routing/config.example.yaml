# ===============================================================================
# Hermes Agent - Reproducible Model Map Configuration Example (Sanitized)
# Location: ~/.hermes/config.yaml
# Version: Hermes Agent 0.8.0
# Architecture: Native Model Map with Subscription Isolation
# ===============================================================================

# -------------------------------------------------------------------------------
# Primary Orchestrator (Root Turn Execution)
# -------------------------------------------------------------------------------
model: gemini-3.8-flash-medium
provider: antigravity-subscription-directsdk
reasoning_effort: medium

# Global fallbacks for the primary orchestrator (empty = fail closed)
fallback_providers: []

# -------------------------------------------------------------------------------
# Auxiliary Subsystems
# -------------------------------------------------------------------------------
auxiliary:
  goal_judge:
    provider: auto  # Dynamically binds to orchestrator client

# -------------------------------------------------------------------------------
# Delegation Subsystem
# -------------------------------------------------------------------------------
delegation:
  backend: model_map
  max_concurrent_children: 10
  backends:
    model_map:
      default: fast
      options:
        # ---------------------------------------------------------------------
        # Scientific Inquiry & Systems Architecture (Claude Pro DirectSDK)
        # Isolated: Zero automatic fallback due to AccountBinding security boundary
        # ---------------------------------------------------------------------
        - name: scientific_research
          provider: claude-subscription-directsdk-experimental
          model: claude-opus-5-5[1m]
          reasoning_effort: medium
          fallback_providers: []

        - name: architecture
          provider: claude-subscription-directsdk-experimental
          model: claude-opus-5-5[1m]
          reasoning_effort: medium
          fallback_providers: []

        # ---------------------------------------------------------------------
        # Routine, Fast & Triage Routes (Antigravity -> Codex Luna -> Codex Terra)
        # ---------------------------------------------------------------------
        - name: fast
          provider: antigravity-subscription-directsdk
          model: gemini-3.8-flash-medium
          reasoning_effort: medium
          fallback_providers:
            - provider: openai-codex
              model: gpt-6-luna
              reasoning_effort: medium
            - provider: openai-codex
              model: gpt-6.1-terra
              reasoning_effort: medium

        - name: routine
          provider: antigravity-subscription-directsdk
          model: gemini-3.8-flash-medium
          reasoning_effort: medium
          fallback_providers:
            - provider: openai-codex
              model: gpt-6-luna
              reasoning_effort: medium
            - provider: openai-codex
              model: gpt-6.1-terra
              reasoning_effort: medium

        # ---------------------------------------------------------------------
        # Codex Engineering Routes (Sol <-> Terra -> Antigravity Sonnet)
        # ---------------------------------------------------------------------
        - name: complex_code_sol
          provider: openai-codex
          model: gpt-6.1-sol
          reasoning_effort: medium
          fallback_providers:
            - provider: openai-codex
              model: gpt-6.1-terra
              reasoning_effort: medium
            - provider: antigravity-subscription-directsdk
              model: claude-sonnet-5-5-medium
              reasoning_effort: medium

        - name: complex_code_terra
          provider: openai-codex
          model: gpt-6.1-terra
          reasoning_effort: medium
          fallback_providers:
            - provider: openai-codex
              model: gpt-6.1-sol
              reasoning_effort: medium
            - provider: antigravity-subscription-directsdk
              model: claude-sonnet-5-5-medium
              reasoning_effort: medium

        - name: hpc_release
          provider: openai-codex
          model: gpt-6.1-terra
          reasoning_effort: medium
          fallback_providers:
            - provider: openai-codex
              model: gpt-6.1-sol
              reasoning_effort: medium
            - provider: antigravity-subscription-directsdk
              model: claude-sonnet-5-5-medium
              reasoning_effort: medium

        - name: implementation
          provider: openai-codex
          model: gpt-6.1-terra
          reasoning_effort: medium
          fallback_providers:
            - provider: openai-codex
              model: gpt-6.1-sol
              reasoning_effort: medium
            - provider: antigravity-subscription-directsdk
              model: claude-sonnet-5-5-medium
              reasoning_effort: medium

        - name: hard_debugging
          provider: openai-codex
          model: gpt-6.1-terra
          reasoning_effort: medium
          fallback_providers:
            - provider: openai-codex
              model: gpt-6.1-sol
              reasoning_effort: medium
            - provider: antigravity-subscription-directsdk
              model: claude-sonnet-5-5-medium
              reasoning_effort: medium

        # ---------------------------------------------------------------------
        # Cross-Family Independent Review Routes
        # ---------------------------------------------------------------------
        - name: review_claude_author
          provider: openai-codex
          model: gpt-6.1-terra
          reasoning_effort: medium
          fallback_providers:
            - provider: openai-codex
              model: gpt-6.1-sol
              reasoning_effort: medium
            - provider: antigravity-subscription-directsdk
              model: claude-sonnet-5-5-medium
              reasoning_effort: medium

        - name: review_openai_author
          provider: claude-subscription-directsdk-experimental
          model: claude-sonnet-5-5[1m]
          reasoning_effort: medium
          fallback_providers: []

        # ---------------------------------------------------------------------
        # Dedicated Claude Pro Subscription Routes
        # ---------------------------------------------------------------------
        - name: claude_opus_55
          provider: claude-subscription-directsdk-experimental
          model: claude-opus-5-5[1m]
          reasoning_effort: medium
          fallback_providers: []

        - name: claude_sonnet_55
          provider: claude-subscription-directsdk-experimental
          model: claude-sonnet-5-5[1m]
          reasoning_effort: medium
          fallback_providers: []

        - name: claude_haiku_55
          provider: claude-subscription-directsdk-experimental
          model: claude-haiku-5-5[1m]
          reasoning_effort: medium
          fallback_providers: []

        # ---------------------------------------------------------------------
        # High-Effort & Reserve Routes
        # ---------------------------------------------------------------------
        - name: argon_deep
          provider: antigravity-subscription-directsdk
          model: gemini-4-argon-high
          reasoning_effort: high
          fallback_providers: []

        - name: astra_heavy
          provider: openai-codex
          model: gpt-6-astra
          reasoning_effort: high
          fallback_providers: []

        - name: antigravity_opus
          provider: antigravity-subscription-directsdk
          model: claude-opus-5-5-high
          reasoning_effort: high
          fallback_providers: []

        - name: antigravity_sonnet
          provider: antigravity-subscription-directsdk
          model: claude-sonnet-5-5-medium
          reasoning_effort: medium
          fallback_providers: []

        - name: direct_opus__high
          provider: claude-subscription-directsdk-experimental
          model: claude-opus-5-5[1m]
          reasoning_effort: high
          fallback_providers: []

        # ---------------------------------------------------------------------
        # Low-Effort Bounded Triage Routes
        # ---------------------------------------------------------------------
        - name: routine__low
          provider: antigravity-subscription-directsdk
          model: gemini-3.8-flash-low
          reasoning_effort: low
          fallback_providers: []

        - name: haiku__low
          provider: claude-subscription-directsdk-experimental
          model: claude-haiku-5-5[1m]
          reasoning_effort: low
          fallback_providers: []
